<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rest — Stillwater Wellness · Card 3 of 3</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
  }
  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Times New Roman", Times, serif;
    background: radial-gradient(circle at 86% 7%, rgba(193, 161, 120, 0.14) 0%, rgba(193, 161, 120, 0.05) 30%, rgba(193, 161, 120, 0) 55%), #f7faff;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .card {
    position: relative;
    width: 840px;
    background: #ffffff;
    border-radius: 48px;
    padding: 72px 72px 68px;
    box-shadow: 0 24px 60px rgba(20, 20, 20, 0.10);
    display: flex;
    flex-direction: column;
  }

  .kicker {
    font-family: Georgia, "Times New Roman", Times, serif;
    font-size: 26px;
    letter-spacing: 0.18em;
    color: #a9854f;
    line-height: 1.2;
  }

  .heading {
    font-family: Georgia, "Times New Roman", Times, serif;
    font-size: 96px;
    color: #283890;
    line-height: 1.04;
    letter-spacing: 0.01em;
    margin-top: 34px;
  }

  .underline {
    width: 110px;
    height: 6px;
    border-radius: 3px;
    background: #c1a178;
    margin-top: 22px;
  }

  .body {
    margin-top: 36px;
    font-family: Georgia, "Times New Roman", Times, serif;
    font-size: 42px;
    line-height: 1.45;
    color: #33443f;
  }
  .body .line-2 {
    margin-top: 10px;
  }

  .footer {
    margin-top: 52px;
    font-family: Georgia, "Times New Roman", Times, serif;
    font-size: 16px;
    letter-spacing: 0.12em;
    color: #5c6b66;
    line-height: 1.4;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">A SLOW-DOWN SERIES · 3 OF 3</div>
    <div class="heading">Rest</div>
    <div class="underline"></div>
    <div class="body">
      <div>Rest is part of wellness, not a reward for finishing everything else.</div>
      <div class="line-2">Even a few quiet minutes away from screens helps.</div>
    </div>
    <div class="footer">STILLWATER WELLNESS · ONENESS WELLNESS LIFESTYLES FOUNDATION</div>
  </div>
</body>
</html>
