<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Move — Stillwater Wellness · Card 2 of 3</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #f7faff;
  }
  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Times New Roman", Times, serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Soft radial lime glow in the top-right corner, echoing the site hero */
  .glow {
    position: absolute;
    top: -180px;
    right: -160px;
    width: 720px;
    height: 720px;
    background: radial-gradient(circle at 50% 50%, rgba(109, 188, 69, 0.14) 0%, rgba(109, 188, 69, 0.05) 42%, rgba(109, 188, 69, 0) 70%);
    pointer-events: none;
  }

  .card {
    position: relative;
    width: 840px;
    background: #ffffff;
    border-radius: 48px;
    padding: 72px 72px 68px;
    box-shadow: 0 24px 60px rgba(20, 20, 20, 0.10);
    display: flex;
    flex-direction: column;
  }

  .kicker {
    font-family: Georgia, "Times New Roman", Times, serif;
    font-size: 26px;
    letter-spacing: 0.18em;
    color: #6dbc45;
    line-height: 1.2;
  }

  .heading {
    font-family: Georgia, "Times New Roman", Times, serif;
    font-size: 96px;
    color: #283890;
    line-height: 1.04;
    letter-spacing: 0.01em;
    margin-top: 34px;
  }

  .underline {
    width: 110px;
    height: 6px;
    border-radius: 3px;
    background: #c1a178;
    margin-top: 22px;
  }

  .body {
    margin-top: 36px;
    font-family: Georgia, "Times New Roman", Times, serif;
    font-size: 42px;
    line-height: 1.45;
    color: #33443f;
  }
  .body .line-2 {
    margin-top: 10px;
  }

  .footer {
    margin-top: 52px;
    font-family: Georgia, "Times New Roman", Times, serif;
    font-size: 22px;
    letter-spacing: 0.16em;
    color: #5c6b66;
    line-height: 1.3;
  }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="card">
    <div class="kicker">A SLOW-DOWN SERIES · 2 OF 3</div>
    <div class="heading">Move</div>
    <div class="underline"></div>
    <div class="body">
      <div>Movement doesn't have to be intense to count.</div>
      <div class="line-2">A short walk. A little stretch. Simply standing up.</div>
    </div>
    <div class="footer">STILLWATER WELLNESS · ONENESS WELLNESS LIFESTYLES FOUNDATION</div>
  </div>
</body>
</html>
