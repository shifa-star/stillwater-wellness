<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Breathe — Stillwater Wellness · Card 1 of 3</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #f7faff;
  }
  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Times New Roman", Times, serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Soft radial teal glow in the top-right corner, echoing the site hero.
     The gradient centre sits just inside the canvas (around x 990, y 90) so
     the glow reads as a gentle wash in the top-right, not a sliver on the edge. */
  .glow {
    position: absolute;
    top: -240px;
    right: -240px;
    width: 820px;
    height: 820px;
    background: radial-gradient(circle at 60% 40%, rgba(37, 196, 184, 0.16) 0%, rgba(37, 196, 184, 0.06) 40%, rgba(37, 196, 184, 0) 66%);
    pointer-events: none;
  }

  .card {
    position: relative;
    width: 840px;
    background: #ffffff;
    border-radius: 48px;
    padding: 72px 72px 66px;
    box-shadow: 0 24px 60px rgba(20, 20, 20, 0.10);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .kicker {
    font-size: 26px;
    letter-spacing: 0.18em;
    color: #0e8c82;
    line-height: 1.2;
  }

  .heading {
    margin-top: 44px;
    font-size: 96px;
    line-height: 1.04;
    letter-spacing: 0.01em;
    color: #283890;
  }

  .underline {
    width: 110px;
    height: 6px;
    border-radius: 3px;
    background: #c1a178;
    margin-top: 24px;
  }

  .body {
    margin-top: 44px;
    font-size: 42px;
    line-height: 1.45;
    color: #33443f;
  }
  .body .line-2 {
    margin-top: 14px;
  }

  .footer {
    margin-top: auto;
    padding-top: 64px;
    font-size: 22px;
    letter-spacing: 0.16em;
    color: #5c6b66;
    line-height: 1.35;
  }
  .footer .f-2 {
    margin-top: 12px;
  }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="card">
    <div class="kicker">A SLOW-DOWN SERIES · 1 OF 3</div>
    <div class="heading">Breathe</div>
    <div class="underline"></div>
    <div class="body">
      <div>A few slow, even breaths</div>
      <div>can quiet a busy mind.</div>
      <div class="line-2">Four counts in. Four counts out.</div>
    </div>
    <div class="footer">
      <div>STILLWATER WELLNESS ·</div>
      <div class="f-2">ONENESS WELLNESS LIFESTYLES FOUNDATION</div>
    </div>
  </div>
</body>
</html>
