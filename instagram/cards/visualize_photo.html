<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Slow-Down Series · Visualize</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
  }

  .card {
    position: relative;
    width: 1080px;
    height: 1080px;
    background: #283890;
  }

  /* Full-bleed background photo */
  .photo {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1080px;
    object-fit: cover;
    display: block;
  }

  /* Soft dark gradient behind the upper text for legibility;
     kept light in the middle so the photo stays visible. */
  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.40) 0%,
      rgba(0, 0, 0, 0.16) 22%,
      rgba(0, 0, 0, 0.06) 42%,
      rgba(0, 0, 0, 0.0) 58%,
      rgba(0, 0, 0, 0.0) 100%
    );
  }

  /* Owner's logo, top-left, with a subtle white drop-shadow */
  .logo {
    position: absolute;
    top: 36px;
    left: 36px;
    width: 200px;
    height: auto;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.30)) drop-shadow(0 0 8px rgba(255, 255, 255, 0.50));
  }

  /* Short, safe kicker kept on the photo at the top */
  .kicker {
    position: absolute;
    top: 158px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #a9854f;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.50), 0 0 10px rgba(0, 0, 0, 0.35);
  }

  /* ---- Solid deep-blue plaque: the card's single legibility zone ---- */
  .plaque {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: #283890;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  .plaque .ribbon {
    height: 8px;
    width: 100%;
    background: #a9854f;
    flex-shrink: 0;
  }

  .plaque-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 36px 36px 30px;
  }

  /* Sand-gold cap ornament: one 18px diamond flanked by two 6px dots */
  .cap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .cap .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #C1A178;
  }

  .cap .diamond {
    width: 18px;
    height: 18px;
    background: #C1A178;
    transform: rotate(45deg);
  }

  .title {
    font-family: Georgia, "Times New Roman", Times, serif;
    font-weight: normal;
    font-size: 64px;
    line-height: 1.0;
    color: #ffffff;
    max-width: 860px;
    margin-top: 8px;
  }

  /* Sand-gold hairline rule */
  .rule {
    width: 120px;
    height: 2px;
    background: #C1A178;
    margin-top: 14px;
  }

  .body {
    font-family: Georgia, "Times New Roman", Times, serif;
    font-weight: normal;
    font-style: italic;
    font-size: 30px;
    line-height: 1.35;
    color: #EAF1F7;
    max-width: 820px;
    margin-top: 22px;
  }

  .footer {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 500;
    font-size: 18px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #C1A178;
    margin-top: 30px;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="photo" src="visualize_photo.jpg" alt="A woman in a navy blazer standing at a bright window, hand on her chest">
    <div class="overlay"></div>
    <img class="logo" src="visualize_logo.png" alt="Oneness Wellness Lifestyles logo">
    <div class="kicker">A SLOW-DOWN SERIES · 2 OF 3</div>

    <div class="plaque">
      <div class="ribbon"></div>
      <div class="plaque-inner">
        <div class="cap">
          <span class="dot"></span>
          <span class="diamond"></span>
          <span class="dot"></span>
        </div>
        <h1 class="title">Visualize</h1>
        <div class="rule"></div>
        <p class="body">Close your eyes and picture the life you want. Seeing it clearly is the first step to living it.</p>
        <div class="footer">STILLWATER WELLNESS · ONENESS WELLNESS LIFESTYLES FOUNDATION</div>
      </div>
    </div>
  </div>
</body>
</html>
