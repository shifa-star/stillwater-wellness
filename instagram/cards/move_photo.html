<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Slow-Down Series · Move</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #283890;
  }
  body {
    position: relative;
    font-family: Georgia, "Times New Roman", Times, serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Full-bleed background photo */
  .photo {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1080px;
    object-fit: cover;
    display: block;
  }

  /* Soft dark gradient overlay behind the upper text.
     Kept light across the middle so the photo stays visible. */
  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(10, 14, 30, 0.55) 0%,
      rgba(10, 14, 30, 0.14) 26%,
      rgba(10, 14, 30, 0.10) 52%,
      rgba(10, 14, 30, 0.30) 78%,
      rgba(10, 14, 30, 0.66) 100%
    );
    pointer-events: none;
  }

  /* Owner's logo, top-left */
  .logo {
    position: absolute;
    top: 36px;
    left: 36px;
    width: 220px;
    height: auto;
    display: block;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.55));
  }

  /* Kicker — the ONLY copy that stays on the photo */
  .kicker {
    position: absolute;
    top: 52px;
    left: 50%;
    transform: translateX(-50%);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 600;
    font-size: 24px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #ffffff;
    white-space: nowrap;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.65), 0 1px 3px rgba(0, 0, 0, 0.5);
  }

  /* Solid deep-blue plaque band across the bottom of the card */
  .plaque {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 340px;
    background: #283890;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    text-align: center;
  }

  /* True brand green hairline at the plaque's top edge */
  .ribbon {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: #6dbc45;
  }

  /* Large white serif hero title */
  .heading {
    font-family: Georgia, "Times New Roman", Times, serif;
    font-weight: normal;
    font-size: 96px;
    line-height: 1.02;
    letter-spacing: 0.01em;
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  }

  /* Single sand-gold diamond as the only motif — the divider */
  .diamond {
    width: 20px;
    height: 20px;
    background: #C1A178;
    transform: rotate(45deg);
    margin: 22px 0 20px;
  }

  /* Italic serif body moved onto the plaque */
  .body {
    font-family: Georgia, "Times New Roman", Times, serif;
    font-weight: normal;
    font-style: italic;
    font-size: 20px;
    line-height: 1.3;
    color: #ffffff;
    opacity: 0.85;
    max-width: 920px;
  }

  /* Footer lockup — small logo mark + wordmark inside the plaque */
  .footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 22px;
    padding-bottom: 40px;
  }
  .footer-mark {
    width: 40px;
    height: auto;
    display: block;
    margin-bottom: 10px;
  }
  .footer-text {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #ffffff;
    opacity: 0.7;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <img class="photo" src="move_photo.jpg" alt="A woman walking outdoors on a garden path at golden hour">
  <div class="overlay"></div>
  <img class="logo" src="move_logo.png" alt="Oneness Wellness Lifestyles Foundation">

  <div class="kicker">A SLOW-DOWN SERIES · 2 OF 3</div>

  <div class="plaque">
    <div class="ribbon"></div>
    <div class="heading">Move</div>
    <div class="diamond"></div>
    <div class="body">Movement doesn't have to be intense to count. A short walk. A little stretch. Simply standing up.</div>
    <div class="footer">
      <img class="footer-mark" src="move_logo.png" alt="">
      <div class="footer-text">Stillwater Wellness · Oneness Wellness Lifestyles Foundation</div>
    </div>
  </div>
</body>
</html>
